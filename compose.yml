# Portainer: Stacks > Add stack > paste this, set the environment variables below in the UI.
services:
  deckweb:
    build: .
    image: deckweb:latest
    container_name: deckweb
    restart: unless-stopped
    ports:
      - "9376:9376"
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}          # required on first run
      SECRET_KEY: ${SECRET_KEY:-}               # optional; auto-generated into /data if empty
      SCRYFALL_USER_AGENT: ${SCRYFALL_USER_AGENT:-DeckWeb/1.0 (self-hosted)}
    volumes:
      - /DATA/AppData/deckweb:/data             # ZimaOS app data path; root FS is read-only

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: deckweb-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - deckweb